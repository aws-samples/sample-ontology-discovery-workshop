openapi: 3.0.3
info:
  title: B2B Payment Settlement API
  version: 1.2.0
  description: 가맹점주·PG 운영팀이 사용하는 정산 API (예제용)

paths:
  /merchants:
    get:
      summary: 가맹점 목록 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Merchant'

  /merchants/{merchantId}/settlements:
    get:
      summary: 가맹점 정산 내역
      parameters:
        - in: path
          name: merchantId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Settlement'

  /settlements/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'

  /settlements/{id}/payouts:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payout'

components:
  schemas:
    Merchant:
      type: object
      required: [id, businessRegistrationNo, name, status]
      properties:
        id: { type: string, format: uuid }
        businessRegistrationNo: { type: string, description: 사업자등록번호 }
        name: { type: string }
        contactEmail: { type: string, format: email }
        status:
          type: string
          enum: [active, suspended, terminated]
        onboardedAt: { type: string, format: date-time }

    Settlement:
      type: object
      required: [id, merchantId, settlementDate, totalAmount, transactionCount, status]
      properties:
        id: { type: string, format: uuid }
        merchantId: { type: string, format: uuid }
        settlementDate: { type: string, format: date }
        totalAmount: { type: number, format: decimal }
        transactionCount: { type: integer }
        status:
          type: string
          enum: [pending, completed, failed]
        settledAt: { type: string, format: date-time, nullable: true }
        # NOTE: DDL은 settlement-payout 1:N이지만 OpenAPI는 단일 payout 노출
        #       → conflicts.md의 C1 사례
        payout:
          $ref: '#/components/schemas/Payout'
          nullable: true

    Payout:
      type: object
      required: [id, settlementId, amount, status]
      properties:
        id: { type: string, format: uuid }
        settlementId: { type: string, format: uuid }
        amount: { type: number, format: decimal }
        paidAt: { type: string, format: date-time, nullable: true }
        status:
          type: string
          enum: [pending, paid, failed]
        bankTransactionRef: { type: string, nullable: true }
